<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bugzap builder test</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 850px;
        margin: 60px auto;
        padding: 24px;
        background: #f4f5f7;
        color: #17202a;
      }
      button,
      a {
        font: inherit;
        margin: 6px;
        padding: 10px 14px;
      }
      #board {
        display: flex;
        gap: 24px;
        margin-top: 32px;
      }
      article {
        flex: 1;
        padding: 32px;
        background: white;
        border: 1px solid #ccd1d8;
        border-radius: 8px;
      }
      output {
        display: block;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Builder test</h1>
    <p>Pin a report to Save changes. Rebuild, reorder, remove, restore, then reload to check the saved pin.</p>
    <nav data-bugzap-ignore>
      <button id="rebuild">Rebuild DOM 20 times</button>
      <button id="reorder">Reorder cards</button>
      <button id="remove">Remove target</button>
      <button id="restore">Restore target</button>
      <button id="reload">Reload page</button>
      <a href="/">Main demo</a>
    </nav>
    <output id="count" data-bugzap-ignore>0 rebuilds</output>
    <div id="board"></div>
    <script>
      let rebuilds = 0, reversed = false, removed = false
      const board = document.getElementById('board')
      function render() {
        const cards = ['<article><h2>Editor</h2><p>A stable target inside a replaced DOM tree.</p><button data-bugzap-id="builder-save">Save changes</button></article>', '<article><h2>Preview</h2><p>The other card moves when reordered.</p><button data-bugzap-id="builder-preview">Preview changes</button></article>']
        if (removed) cards.shift()
        if (reversed) cards.reverse()
        board.innerHTML = cards.join('')
        document.getElementById('count').textContent = `${rebuilds} rebuilds`
      }
      document.getElementById('rebuild').onclick = () => { for (let i = 0; i < 20; i++) { rebuilds++; render() } }
      document.getElementById('reorder').onclick = () => { reversed = !reversed; render() }
      document.getElementById('remove').onclick = () => { removed = true; render() }
      document.getElementById('restore').onclick = () => { removed = false; render() }
      document.getElementById('reload').onclick = () => location.reload()
      render()
      window.Bugzap = function () { (Bugzap.q = Bugzap.q || []).push(arguments) }
      Bugzap('init', {{BUGZAP_CONFIG}})
    </script>
    <script async src="{{BUGZAP_ORIGIN}}/v1/bugzap.js"></script>
  </body>
</html>
